# ============================================================================
# AI Wealth — Continuous Integration
# Runs on every pull request and on pushes to main / develop.
# A PR must pass install → lint → typecheck → test → build before merging.
# ============================================================================
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.18'
  PNPM_VERSION: '10.23.0'

jobs:
  # ---------------------------------------------------------------- install --
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

  # -------------------------------------------------------------------- lint --
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check

  # --------------------------------------------------------------- typecheck --
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client (required by typecheck)
        run: pnpm --filter @ai-wealth/database exec prisma generate
      - run: pnpm run typecheck

  # -------------------------------------------------------------------- test --
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @ai-wealth/database exec prisma generate
      - run: pnpm run test
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            **/coverage/
            !**/node_modules/**
          if-no-files-found: ignore
          retention-days: 7

  # ------------------------------------------------------------------- build --
  build:
    name: Build all packages
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @ai-wealth/database exec prisma generate
      - run: pnpm run build
      - name: Verify build artifacts exist
        run: |
          test -f packages/shared/dist/index.js
          test -f packages/config/dist/index.js
          test -f packages/database/dist/index.js
          test -f packages/ui/dist/index.js
          test -f services/api/dist/main.js
          test -f services/worker/dist/main.js
          test -f services/blockchain/dist/main.js
          test -f apps/web/.next/BUILD_ID
          test -f apps/admin/dist/index.html

  # ------------------------------------------------------ secret/secret scan --
  secret-scan:
    name: Secret scan (no secrets in code)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify .env files are not tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.env\.example'; then
            echo "::error::A .env file is tracked by git. Remove it immediately."
            exit 1
          fi
          echo "OK: no .env files are tracked."
      - name: Verify no plaintext private keys / mnemonics
        run: |
          if grep -rE 'BEGIN (RSA|EC|OPENSSH|PRIVATE) PRIVATE KEY|mnemonic|seed phrase|0x[a-fA-F0-9]{64}' \
              --exclude-dir=node_modules --exclude-dir=.git \
              --exclude='*.lock' --exclude='pnpm-lock.yaml' \
              . ; then
            echo "::error::Potential secret/private key detected in tracked files."
            exit 1
          fi
          echo "OK: no plaintext secrets detected."

  # --------------------------------------------------------- docker compose --
  docker-build:
    name: Build all Docker images (api, worker, blockchain, web, admin, nginx)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.api
          push: false
          tags: ai-wealth/api:ci
      - name: Build Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.worker
          push: false
          tags: ai-wealth/worker:ci
      - name: Build Blockchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.blockchain
          push: false
          tags: ai-wealth/blockchain:ci
      - name: Build Web (Next.js DApp) image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.web
          push: false
          tags: ai-wealth/web:ci
      - name: Build Admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.admin
          push: false
          tags: ai-wealth/admin:ci
      - name: Build Edge Nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.nginx
          push: false
          tags: ai-wealth/nginx:ci

  # ----------------------------------------------------- required gate job --
  # A status check that PRs can require as a single "CI passed" gate.
  # NOTE: GitHub Actions expressions `${{ }}` do NOT support bash variable
  # interpolation inside them (e.g. `${{ needs[$r].result }}` is invalid and
  # makes the whole workflow file fail to parse). We materialize each needed
  # job's result into a shell env var, then inspect them in bash.
  ci-pass:
    name: CI passed (gate)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build, secret-scan, docker-build]
    if: always()
    env:
      LINT_RESULT: ${{ needs.lint.result }}
      TYPECHECK_RESULT: ${{ needs.typecheck.result }}
      TEST_RESULT: ${{ needs.test.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
      DOCKER_BUILD_RESULT: ${{ needs.docker-build.result }}
    steps:
      - name: Aggregate results
        run: |
          # bash associative array: job name -> its needs[].result
          declare -A results=(
            [lint]="$LINT_RESULT"
            [typecheck]="$TYPECHECK_RESULT"
            [test]="$TEST_RESULT"
            [build]="$BUILD_RESULT"
            [secret-scan]="$SECRET_SCAN_RESULT"
            [docker-build]="$DOCKER_BUILD_RESULT"
          )
          failed=0
          for r in "${!results[@]}"; do
            status="${results[$r]}"
            echo "$r=$status"
            if [ "$status" != "success" ]; then
              echo "::error::Job $r did not succeed (status: $status)"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "All CI jobs passed."
