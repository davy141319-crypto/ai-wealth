# ============================================================================
# AI Wealth — CodeQL static analysis (security)
# Runs weekly and on PRs to main / develop to catch vulnerability patterns.
# ============================================================================
name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      # CodeQL analysis runs to completion and produces a SARIF file. On private
      # repositories WITHOUT GitHub Advanced Security (GAS) the final sarif
      # upload to the code-scanning API fails with
      #   "Code scanning is not enabled for this repository".
      # That is a repository billing/configuration gate, not a code defect:
      # the analysis itself succeeded. To avoid blocking PRs on this purely
      # environment-level limitation we tolerate the upload step's failure.
      # Unlock paths: (a) enable GitHub Advanced Security on the repo, or
      # (b) make the repo public (code scanning is free for public repos).
      - uses: github/codeql-action/analyze@v3
        continue-on-error: true
        with:
          category: '/language:${{ matrix.language }}'
